<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Davomat jurnali</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
    transition: 0.3s;
}

body.dark {
    background: #121212;
    color: #eee;
}

button,
input {
    font-family: inherit;
}

/* LOGIN */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 380px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.15);
}

.dark .login-box {
    background: #1e1e1e;
}

.login-box h2 {
    text-align: center;
    margin-top: 0;
}

.login-box input[type="text"],
.login-box input[type="password"] {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.dark .login-box input {
    background: #2b2b2b;
    color: white;
    border-color: #555;
}

.remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0;
}

.login-btn {
    width: 100%;
    padding: 12px;
    background: #1976d2;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.login-btn:hover {
    background: #125ca5;
}

#error {
    color: red;
    text-align: center;
    margin-top: 10px;
}

/* MAIN */

#mainPage {
    display: none;
}

header {
    padding: 15px;
    background: #1976d2;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

header h2 {
    margin: 0;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.header-buttons button {
    border: none;
    padding: 9px 12px;
    border-radius: 7px;
    cursor: pointer;
    background: white;
    color: #222;
}

.container {
    padding: 15px;
}

.info {
    background: white;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.dark .info {
    background: #1e1e1e;
}

.status {
    font-size: 14px;
    margin-top: 5px;
}

.sync-ok {
    color: green;
}

.sync-error {
    color: red;
}

/* TABLE */

.table-wrapper {
    overflow-x: auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

.dark .table-wrapper {
    background: #1e1e1e;
}

table {
    border-collapse: collapse;
    min-width: max-content;
    width: 100%;
}

th,
td {
    border: 1px solid #ccc;
    text-align: center;
    padding: 5px;
}

.dark th,
.dark td {
    border-color: #444;
}

th {
    background: #1976d2;
    color: white;
    position: sticky;
    top: 0;
    z-index: 5;
}

.number {
    width: 55px;
    min-width: 55px;
    position: sticky;
    left: 0;
    z-index: 7;
    background: #1976d2;
    color: white;
}

.name {
    width: 190px;
    min-width: 190px;
    text-align: left;
    position: sticky;
    left: 55px;
    z-index: 6;
    background: #1976d2;
    color: white;
}

tbody .number {
    background: white;
    color: inherit;
}

tbody .name {
    background: white;
    color: inherit;
}

.dark tbody .number,
.dark tbody .name {
    background: #1e1e1e;
    color: #eee;
}

.date-header {
    width: 90px;
    min-width: 90px;
    font-size: 12px;
    white-space: nowrap;
}

.attendance {
    width: 90px;
    min-width: 90px;
    height: 38px;
    border: none;
    background: transparent;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    outline: none;
}

.attendance:focus {
    background: rgba(25,118,210,0.08);
}

/* + va - ranglari */

.attendance.plus {
    color: #1976d2;
}

.attendance.minus {
    color: #e53935;
}

/* BLOKLANGAN SANA */

.locked {
    background: #e5e5e5 !important;
    color: #777 !important;
}

.dark .locked {
    background: #292929 !important;
    color: #777 !important;
}

.locked-cell {
    background: #e5e5e5;
    color: #888;
    cursor: not-allowed;
    font-size: 16px;
}

.dark .locked-cell {
    background: #292929;
    color: #777;
}

.locked-header {
    background: #666 !important;
    color: #ddd !important;
}

.lock-reason {
    display: block;
    font-size: 9px;
    margin-top: 2px;
}

/* MOBILE */

@media (max-width: 600px) {

    header {
        align-items: flex-start;
    }

    header h2 {
        font-size: 19px;
    }

    .header-buttons button {
        font-size: 12px;
        padding: 8px;
    }

    .container {
        padding: 8px;
    }

    .name {
        width: 165px;
        min-width: 165px;
        left: 55px;
    }

    .date-header,
    .attendance {
        width: 82px;
        min-width: 82px;
    }

    .info {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

    <div class="login-box">

        <h2>🔐 Davomat jurnali</h2>

        <input
            type="text"
            id="username"
            placeholder="Login"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="Parol"
            autocomplete="current-password"
        >

        <label class="remember">
            <input type="checkbox" id="remember">
            Loginni eslab qolish
        </label>

        <button class="login-btn" onclick="login()">
            Kirish
        </button>

        <div id="error"></div>

    </div>

</div>


<!-- MAIN PAGE -->

<div id="mainPage">

<header>

    <h2>📋 Davomat jurnali</h2>

    <div class="header-buttons">

        <button onclick="toggleDarkMode()">
            🌙 Dark
        </button>

        <button onclick="logout()">
            🚪 Chiqish
        </button>

    </div>

</header>


<div class="container">

    <div class="info">

        <b>O‘quv davri:</b>
        28.09.2026 — 25.05.2027

        <br><br>

        <b>Belgilar:</b>
        <span style="color:#1976d2;font-weight:bold;">+</span> Keldi
        &nbsp;&nbsp;
        <span style="color:#e53935;font-weight:bold;">−</span> Kelmadi
        &nbsp;&nbsp;
        🔒 Dam olish

        <div class="status" id="syncStatus">
            🔄 Firebase bilan ulanmoqda...
        </div>

    </div>


    <div class="table-wrapper">

        <table id="attendanceTable">

            <thead id="tableHead"></thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

</div>

</div>


<!-- FIREBASE -->

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    set
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyAo-tioaUvivf965VRhRjJao-WXyU0AVTY",
    authDomain: "davomat-jurnali.firebaseapp.com",
    databaseURL: "https://davomat-jurnali-default-rtdb.firebaseio.com",
    projectId: "davomat-jurnali",
    storageBucket: "davomat-jurnali.firebasestorage.app",
    messagingSenderId: "859496944977",
    appId: "1:859496944977:web:ce853ba3191f6a086cef70",
    measurementId: "G-8CMSQF83T6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* =========================
   LOGIN
========================= */

const CORRECT_USERNAME = "abdulloh04072009";
const CORRECT_PASSWORD = "abdulloh2009.";


/* =========================
   O'QUV DAVRI
========================= */

const START_DATE = "2026-09-28";
const END_DATE   = "2027-05-25";


/* =========================
   O'QUVCHILAR
========================= */

const students = [
    "Abdumannobova Ruqiyaxon",
    "Abdumutallibov Muhammadali",
    "Abdug‘afforova Muslimaxon",
    "Abvarova Muharram",
    "Arabbekova Ruqiyaxon",
    "Baxromova Xabibaxon",
    "Baxodirjonova Kimyoxon",
    "Habibullayev Abdulloh",
    "Ibroximova Mo'minaxon",
    "Jo'rayev Hikmatillo",
    "Komilova Oydinoy",
    "Komilova Rayyona",
    "Muhammadsidiqova Shaxodatxon",
    "Muqimjonova Muzayyanaxon",
    "Muhammadkomilov Abduraxmon",
    "Nishonboyeva Mo'mina ",
    "O'ktamov Rahmatillo",
    "Oribjonova Robiyaxon",
    "Qosimova Rayyona",
    "Soyibjonov Abduqodir",
    "Soyibjonova Mohlaroy",
    "Ubaydullayeva Bibisora",
    "Yaqubov Abdulboriy",
    "Yuldasheva Muhlisaxon",
    "Yuldasheva Muhlisaxon"
];


/* =========================
   ATTENDANCE DATA
========================= */

let attendanceData = {};

const DATABASE_PATH = "davomat_jurnali";


/* =========================
   LOCAL DARK MODE
========================= */

if (localStorage.getItem("davomat_dark") === "true") {
    document.body.classList.add("dark");
}


/* =========================
   LOGIN HOLATI
========================= */

function checkLogin() {

    const sessionLogin =
        sessionStorage.getItem("davomat_login");

    const remembered =
        localStorage.getItem("davomat_remember");

    if (sessionLogin === "true" || remembered === "true") {

        showMain();

    } else {

        document.getElementById("loginPage").style.display = "flex";
        document.getElementById("mainPage").style.display = "none";

    }
}


window.login = function() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const remember =
        document.getElementById("remember").checked;


    if (
        username === CORRECT_USERNAME &&
        password === CORRECT_PASSWORD
    ) {

        sessionStorage.setItem("davomat_login", "true");

        if (remember) {
            localStorage.setItem("davomat_remember", "true");
        } else {
            localStorage.removeItem("davomat_remember");
        }

        document.getElementById("error").textContent = "";

        showMain();

    } else {

        document.getElementById("error").textContent =
            "Login yoki parol noto‘g‘ri.";

    }

};


window.logout = function() {

    sessionStorage.removeItem("davomat_login");
    localStorage.removeItem("davomat_remember");

    location.reload();

};


/* Enter tugmasi */

document.addEventListener("keydown", function(e) {

    if (
        e.key === "Enter" &&
        document.getElementById("loginPage").style.display !== "none"
    ) {
        login();
    }

});


/* =========================
   DARK MODE
========================= */

window.toggleDarkMode = function() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "davomat_dark",
        document.body.classList.contains("dark")
    );

};


/* =========================
   SANA FUNKSIYALARI
========================= */

function parseDate(str) {

    const [y, m, d] = str.split("-").map(Number);

    return new Date(y, m - 1, d);

}


function formatDate(date) {

    const d =
        String(date.getDate()).padStart(2, "0");

    const m =
        String(date.getMonth() + 1).padStart(2, "0");

    const y =
        date.getFullYear();

    return `${d}.${m}.${y}`;

}


function toISO(date) {

    const y =
        date.getFullYear();

    const m =
        String(date.getMonth() + 1).padStart(2, "0");

    const d =
        String(date.getDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;

}


/* =========================
   BLOKLANGAN SANALAR
========================= */

function getLockReason(date) {

    const iso = toISO(date);

    const day = date.getDay();


    /* Yakshanba */

    if (day === 0) {
        return "Yakshanba";
    }


    /* Kuzgi ta'til
       04.11.2026 - 09.11.2026
    */

    if (
        iso >= "2026-11-04" &&
        iso <= "2026-11-09"
    ) {
        return "Kuzgi ta'til";
    }


    /* Qishki ta'til
       28.12.2026 - 10.01.2027
    */

    if (
        iso >= "2026-12-28" &&
        iso <= "2027-01-10"
    ) {
        return "Qishki ta'til";
    }


    /* Bahorgi ta'til
       21.03.2027 - 27.03.2027
    */

    if (
        iso >= "2027-03-21" &&
        iso <= "2027-03-27"
    ) {
        return "Bahorgi ta'til";
    }


    /* Rasmiy bayramlar */

    const holidays = {

        "2026-10-01": "O‘qituvchi va murabbiylar kuni",
        "2026-12-08": "Konstitutsiya kuni",

        "2027-01-01": "Yangi yil",

        "2027-03-08": "Xotin-qizlar kuni",
        "2027-03-21": "Navro‘z",

        "2027-05-09": "Xotira va qadrlash kuni"

    };


    if (holidays[iso]) {
        return holidays[iso];
    }


    return null;

}


/* =========================
   SANALARNI AVTOMATIK YARATISH
========================= */

function generateDates() {

    const dates = [];

    let current =
        parseDate(START_DATE);

    const end =
        parseDate(END_DATE);


    while (current <= end) {

        dates.push({
            iso: toISO(current),
            display: formatDate(current),
            lock: getLockReason(current)
        });

        current.setDate(
            current.getDate() + 1
        );

    }

    return dates;

}


const dates = generateDates();


/* =========================
   JADVALNI CHIZISH
========================= */

function renderTable() {

    const head =
        document.getElementById("tableHead");

    const body =
        document.getElementById("tableBody");


    head.innerHTML = "";
    body.innerHTML = "";


    /* HEADER */

    const headerRow =
        document.createElement("tr");


    const numberTh =
        document.createElement("th");

    numberTh.className = "number";
    numberTh.textContent = "Number";

    headerRow.appendChild(numberTh);


    const nameTh =
        document.createElement("th");

    nameTh.className = "name";
    nameTh.textContent = "Ism Familya";

    headerRow.appendChild(nameTh);


    dates.forEach(date => {

        const th =
            document.createElement("th");

        th.className = "date-header";


        if (date.lock) {

            th.classList.add("locked-header");

            th.innerHTML =
                `${date.display}
                 <span class="lock-reason">
                    🔒 ${date.lock}
                 </span>`;

        } else {

            th.textContent =
                date.display;

        }


        headerRow.appendChild(th);

    });


    head.appendChild(headerRow);


    /* O'QUVCHILAR */

    students.forEach((student, studentIndex) => {

        const row =
            document.createElement("tr");


        const number =
            document.createElement("td");

        number.className = "number";

        number.textContent =
            studentIndex + 1;

        row.appendChild(number);


        const name =
            document.createElement("td");

        name.className = "name";

        name.textContent =
            student;

        row.appendChild(name);


        dates.forEach(date => {

            const cell =
                document.createElement("td");


            if (date.lock) {

                cell.className = "locked-cell";

                cell.textContent = "🔒";

                cell.title =
                    date.lock;

            } else {

                const input =
                    document.createElement("input");

                input.type = "text";

                input.maxLength = 1;

                input.className = "attendance";


                const key =
                    `${studentIndex}_${date.iso}`;


                input.value =
                    attendanceData[key] || "";


                updateColor(input);


                input.addEventListener(
                    "input",
                    async function() {

                        let value =
                            this.value.trim();


                        if (
                            value !== "+" &&
                            value !== "-"
                        ) {

                            this.value = "";

                            delete attendanceData[key];

                            await saveToFirebase();

                            return;

                        }


                        this.value = value;

                        attendanceData[key] =
                            value;


                        updateColor(this);

                        await saveToFirebase();

                    }
                );


                cell.appendChild(input);

            }


            row.appendChild(cell);

        });


        body.appendChild(row);

    });

}


/* =========================
   + / - RANGLARI
========================= */

function updateColor(input) {

    input.classList.remove(
        "plus",
        "minus"
    );


    if (input.value === "+") {

        input.classList.add("plus");

    }


    if (input.value === "-") {

        input.classList.add("minus");

    }

}


/* =========================
   FIREBASEGA SAQLASH
========================= */

async function saveToFirebase() {

    try {

        await set(
            ref(db, DATABASE_PATH),
            {
                attendance: attendanceData,
                updatedAt: Date.now()
            }
        );


        setSyncStatus(
            "☁️ Ma'lumot Firebase'ga saqlandi.",
            true
        );


    } catch (error) {

        console.error(error);

        setSyncStatus(
            "❌ Firebase'ga saqlashda xatolik.",
            false
        );

    }

}


/* =========================
   FIREBASE'DAN O'QISH
========================= */

onValue(
    ref(db, DATABASE_PATH),
    snapshot => {

        const data =
            snapshot.val();


        if (data && data.attendance) {

            attendanceData =
                data.attendance;

        } else {

            attendanceData = {};

        }


        renderTable();


        setSyncStatus(
            "☁️ Firebase bilan sinxronlangan.",
            true
        );

    },
    error => {

        console.error(error);

        setSyncStatus(
            "❌ Firebase bilan ulanishda xatolik.",
            false
        );

    }
);


/* =========================
   STATUS
========================= */

function setSyncStatus(message, success) {

    const element =
        document.getElementById("syncStatus");


    if (!element) return;


    element.textContent =
        message;


    element.className =
        "status " +
        (success ? "sync-ok" : "sync-error");

}


/* =========================
   MAIN PAGE
========================= */

function showMain() {

    document.getElementById("loginPage").style.display =
        "none";

    document.getElementById("mainPage").style.display =
        "block";

}


/* =========================
   START
========================= */

checkLogin();

</script>

</body>
</html>
