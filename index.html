/* =========================

function parseDate(str) {

    const [y, m, d] =
        str.split("-").map(Number);

    return new Date(
        y,
        m - 1,
        d
    );

}


function formatDate(date) {

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const y =
        date.getFullYear();


    return `${d}.${m}.${y}`;

}


function toISO(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");


    return `${y}-${m}-${d}`;

}


/* =========================
   BLOKLANGAN SANALAR
========================= */

function getLockReason(date) {

    const iso =
        toISO(date);

    const day =
        date.getDay();


    /* Yakshanba */

    if (day === 0) {

        return "Yakshanba";

    }


    /* Kuzgi ta'til */

    if (
        iso >= "2026-11-04" &&
        iso <= "2026-11-09"
    ) {

        return "Kuzgi ta'til";

    }


    /* Qishki ta'til */

    if (
        iso >= "2026-12-28" &&
        iso <= "2027-01-10"
    ) {

        return "Qishki ta'til";

    }


    /* Bahorgi ta'til */

    if (
        iso >= "2027-03-21" &&
        iso <= "2027-03-27"
    ) {

        return "Bahorgi ta'til";

    }


    /* Rasmiy bayramlar */

    const holidays = {

        "2026-10-01":
            "O‘qituvchi va murabbiylar kuni",

        "2026-12-08":
            "Konstitutsiya kuni",

        "2027-01-01":
            "Yangi yil",

        "2027-03-08":
            "Xotin-qizlar kuni",

        "2027-03-21":
            "Navro‘z",

        "2027-05-09":
            "Xotira va qadrlash kuni"

    };


    if (holidays[iso]) {

        return holidays[iso];

    }


    return null;

}


/* =========================
   SANALARNI YARATISH
========================= */

function generateDates() {

    const dates = [];

    let current =
        parseDate(START_DATE);

    const end =
        parseDate(END_DATE);


    while (current <= end) {

        dates.push({

            iso:
                toISO(current),

            display:
                formatDate(current),

            lock:
                getLockReason(current)

        });


        current.setDate(
            current.getDate() + 1
        );

    }


    return dates;

}


const dates =
    generateDates();

function renderTable() {

        );

                input.addEventListener(

                        this.value =

                        attendanceData[key] =

                        updateColor(this);


                        await saveToFirebase();

                    }
                );


                cell.appendChild(

function updateColor(input) {

    input.classList.remove(
        "plus",
        "minus"
    );


    if (
        input.value === "+"
    ) {

        input.classList.add(
            "plus"
        );

    }


    if (
        input.value === "-"
    ) {

        input.classList.add(
            "minus"
        );

    }

}


/* =========================
   FIREBASEGA SAQLASH
========================= */

async function saveToFirebase() {

    try {

        await set(
            ref(
                db,
                DATABASE_PATH
            ),
            {

                attendance:
                    attendanceData,

                updatedAt:
                    Date.now()

            }
        );


        setSyncStatus(
            "☁️ Ma’lumot Firebase'ga saqlandi.",
            true
        );


    } catch (error) {

        console.error(error);


        setSyncStatus(
            "❌ Firebase'ga saqlashda xatolik.",
            false
        );

    }

}

onValue(

    ),

        if (

            data.attendance
        ) {

        } else {

            attendanceData = {};

        renderTable();


        /*

        );

);


/* =========================
   STATUS
========================= */

function setSyncStatus(
    message,
    success
) {

    const element =
        document.getElementById(
            "syncStatus"
        );


    if (!element) return;


    element.textContent =
        message;


    element.className =
        "status " +
        (
            success
            ? "sync-ok"
            : "sync-error"
        );

}

/* =========================
   HISOBOTNI HISOBLASH
========================= */

window.renderReport = function() {

    const body =
        document.getElementById(
            "reportBody"
        );


    const search =
        document.getElementById(
            "reportSearch"
        ).value
        .toLowerCase()
        .trim();


    body.innerHTML = "";


    let totalPlus = 0;
    let totalMinus = 0;
    let visibleStudents = 0;


    students.forEach(
        (student, studentIndex) => {

        /* Qidirish */

        if (
            search &&
            !student
                .toLowerCase()
                .includes(search)
        ) {

            return;

        }


        visibleStudents++;


        let plusCount = 0;
        let minusCount = 0;


        /*
         * Barcha sanalarni tekshiramiz.
         * 🔒 kunlarda qiymat bo'lmaydi,
         * shuning uchun ular hisobga
         * olinmaydi.
         */

        dates.forEach(date => {

            const key =
                `${studentIndex}_${date.iso}`;


            const value =
                attendanceData[key];


            if (value === "+") {

                plusCount++;

            }


            if (value === "-") {

                minusCount++;

            }

        });


        const total =
            plusCount + minusCount;


        totalPlus +=
            plusCount;

        totalMinus +=
            minusCount;


        const row =
            document.createElement("tr");


        /* № */

        const number =
            document.createElement("td");

        number.textContent =
            studentIndex + 1;

        row.appendChild(
            number
        );


        /* Ism */

        const name =
            document.createElement("td");

        name.textContent =
            student;

        name.style.textAlign =
            "left";

        row.appendChild(
            name
        );


        /* Keldi */

        const plus =
            document.createElement("td");

        plus.textContent =
            plusCount;

        plus.className =
            "count-plus";

        row.appendChild(
            plus
        );


        /* Qoldirdi */

        const minus =
            document.createElement("td");

        minus.textContent =
            minusCount;

        minus.className =
            "count-minus";

        row.appendChild(
            minus
        );


        /* Jami */

        const totalCell =
            document.createElement("td");

        totalCell.textContent =
            total;

        totalCell.className =
            "count-total";

        row.appendChild(
            totalCell
        );


        body.appendChild(
            row
        );

    });


    /* Yuqoridagi umumiy hisob */

    document.getElementById(
        "summaryStudents"
    ).textContent =
        visibleStudents;


    document.getElementById(
        "summaryPlus"
    ).textContent =
        totalPlus;


    document.getElementById(
        "summaryMinus"
    ).textContent =
        totalMinus;


    document.getElementById(
        "summaryTotal"
    ).textContent =
        totalPlus + totalMinus;

};
