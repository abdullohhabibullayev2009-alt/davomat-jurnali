<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Davomat jurnali</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

body.dark {
    background: #121212;
    color: #eee;
}

/* LOGIN */
#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 380px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.15);
}

.dark .login-box {
    background: #1e1e1e;
    color: white;
}

.login-box h1 {
    text-align: center;
    margin-bottom: 25px;
}

.login-box input[type="text"],
.login-box input[type="password"] {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.dark .login-box input[type="text"],
.dark .login-box input[type="password"] {
    background: #2b2b2b;
    color: white;
    border-color: #555;
}

.remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 15px;
    font-size: 14px;
}

.login-box button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.login-box button:hover {
    background: #1565c0;
}

#error {
    color: #e53935;
    text-align: center;
    margin-top: 12px;
}

/* MAIN */
#mainPage {
    display: none;
}

header {
    padding: 15px;
    background: #1976d2;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.header-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

header button {
    border: none;
    padding: 9px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
}

.container {
    padding: 15px;
    overflow-x: auto;
}

.top-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.top-buttons button {
    padding: 10px 14px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    background: #1976d2;
    color: white;
}

.top-buttons button:hover {
    background: #1565c0;
}

table {
    border-collapse: collapse;
    width: max-content;
    min-width: 100%;
    background: white;
}

.dark table {
    background: #1e1e1e;
}

th,
td {
    border: 1px solid #ccc;
    padding: 7px;
    text-align: center;
}

.dark th,
.dark td {
    border-color: #555;
}

th {
    background: #1976d2;
    color: white;
}

.number {
    width: 55px;
    min-width: 55px;
}

.name {
    width: 230px;
    min-width: 230px;
    text-align: left;
}

.date {
    width: 100px;
    min-width: 100px;
}

.attendance-input {
    width: 70px;
    border: none;
    outline: none;
    background: transparent;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
}

.dark .attendance-input {
    color: white;
}

.present {
    color: #1976d2;
}

.absent {
    color: #e53935;
}

.dark .present {
    color: #64b5f6;
}

.dark .absent {
    color: #ef5350;
}

.name-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: inherit;
}

.delete-date {
    display: block;
    margin: 5px auto 0;
    border: none;
    background: #e53935;
    color: white;
    border-radius: 4px;
    padding: 3px 6px;
    cursor: pointer;
    font-size: 11px;
}

.dark .delete-date {
    background: #c62828;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 18px;
    }

    .container {
        padding: 8px;
    }

    .name {
        width: 190px;
        min-width: 190px;
    }

    .date {
        width: 90px;
        min-width: 90px;
    }

    .attendance-input {
        width: 60px;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage">

    <div class="login-box">

        <h1>📋 Davomat jurnali</h1>

        <input
            type="text"
            id="username"
            placeholder="Login"
        >

        <input
            type="password"
            id="password"
            placeholder="Parol"
        >

        <label class="remember">
            <input type="checkbox" id="rememberMe">
            Loginni eslab qolish
        </label>

        <button onclick="login()">Kirish</button>

        <div id="error"></div>

    </div>

</div>


<!-- MAIN PAGE -->
<div id="mainPage">

<header>

    <h1>📋 Davomat jurnali</h1>

    <div class="header-buttons">

        <button onclick="toggleDarkMode()">
            🌙 Dark Mode
        </button>

        <button onclick="logout()">
            🚪 Chiqish
        </button>

    </div>

</header>


<div class="container">

    <div class="top-buttons">

        <button onclick="addDate()">
            ➕ Sana qo‘shish
        </button>

    </div>

    <div id="tableContainer"></div>

</div>

</div>


<script>

/* =========================
   LOGIN MA'LUMOTLARI
========================= */

const CORRECT_USERNAME = "abdulloh04072009";
const CORRECT_PASSWORD = "abdulloh2009.";


/* =========================
   O'QUVCHILAR
========================= */

const defaultNames = [
    "Abdumannob Ruqiyaxon",
    "Abdumutalibov Muhammadali",
    "Abdug'offorova Muslimaxon",
    "Anvarova Muxarramxon",
    "Arabekova Ruqiya",
    "Baxromova Xabibaxon",
    "Boxodirjonova Kimyoxon",
    "Habibullayev Abdulloh",
    "Ibroximova Mu'minaxon",
    "Jo'rayev Xikmatillo",
    "Komilova Oydinoy",
    "Komilova Rayyona",
    "Mamasidiqova Shaxzodatxon",
    "Muqumjonova Muzayyana",
    "Nishonboyeva Mo'minaxon",
    "O'ktamov Raxmatillo",
    "Oribjonova Robiyaxon",
    "Qosimova Rayyona",
    "Soyibjonov Abduqodir",
    "Soyibjonova Moxlaroyim",
    "Ubaydullayeva Soraxon",
    "Yaqubov Abdulboriy",
    "Yuldashboyeva Rayona",
    "Yuldasheva Muhlisaxon",
    "Muhammadkomilov Abduraxmon"
];


/* =========================
   MA'LUMOTLARNI YUKLASH
========================= */

let data;

try {

    data = JSON.parse(
        localStorage.getItem("davomat_jurnali")
    );

} catch (e) {

    data = null;

}


if (!data) {

    data = {

        dates: [
            "02.10.2026",
            "07.10.2026",
            "09.10.2026"
        ],

        names: [...defaultNames],

        attendance: []

    };

}


/* Agar names yo'q bo'lsa */

if (!data.names) {

    data.names = [...defaultNames];

}


/* Agar attendance yo'q bo'lsa */

if (!data.attendance) {

    data.attendance = [];

}


/* =========================
   ESKI SANALARNI O'ZGARTIRISH
   2026-10-02 -> 02.10.2026
========================= */

data.dates = data.dates.map(function(date) {

    if (/^\d{4}-\d{2}-\d{2}$/.test(date)) {

        const parts = date.split("-");

        return parts[2] + "." + parts[1] + "." + parts[0];

    }

    return date;

});


/* =========================
   SAQLASH
========================= */

function saveData() {

    localStorage.setItem(
        "davomat_jurnali",
        JSON.stringify(data)
    );

}


/* =========================
   LOGIN
========================= */

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const remember =
        document.getElementById("rememberMe").checked;

    const error =
        document.getElementById("error");


    if (
        username === CORRECT_USERNAME &&
        password === CORRECT_PASSWORD
    ) {

        error.textContent = "";


        sessionStorage.setItem(
            "davomat_logged_in",
            "true"
        );


        if (remember) {

            localStorage.setItem(
                "davomat_remember",
                "true"
            );

        } else {

            localStorage.removeItem(
                "davomat_remember"
            );

        }


        showMain();

    } else {

        error.textContent =
            "Login yoki parol noto‘g‘ri!";

    }

}


/* =========================
   ENTER BILAN KIRISH
========================= */

document
    .getElementById("password")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            login();

        }

    });


/* =========================
   ASOSIY SAHIFANI OCHISH
========================= */

function showMain() {

    document.getElementById("loginPage").style.display =
        "none";

    document.getElementById("mainPage").style.display =
        "block";

    render();

}


/* =========================
   LOGOUT
========================= */

function logout() {

    sessionStorage.removeItem(
        "davomat_logged_in"
    );

    localStorage.removeItem(
        "davomat_remember"
    );


    document.getElementById("mainPage").style.display =
        "none";

    document.getElementById("loginPage").style.display =
        "flex";


    document.getElementById("username").value = "";

    document.getElementById("password").value = "";

    document.getElementById("rememberMe").checked = false;

}


/* =========================
   SAHIFA OCHILGANDA
========================= */

const isLoggedIn =
    sessionStorage.getItem("davomat_logged_in");

const remembered =
    localStorage.getItem("davomat_remember");


if (
    isLoggedIn === "true" ||
    remembered === "true"
) {

    sessionStorage.setItem(
        "davomat_logged_in",
        "true"
    );

    showMain();

} else {

    document.getElementById("loginPage").style.display =
        "flex";

    document.getElementById("mainPage").style.display =
        "none";

}


/* =========================
   JADVAL
========================= */

function render() {

    const container =
        document.getElementById("tableContainer");


    let html = `

        <table>

            <thead>

                <tr>

                    <th class="number">
                        number
                    </th>

                    <th class="name">
                        Ism va Familya
                    </th>

    `;


    /* SANALAR */

    data.dates.forEach(function(date, dateIndex) {

        html += `

            <th class="date">

                ${date}

                <button
                    class="delete-date"
                    onclick="deleteDate(${dateIndex})"
                >
                    ×
                </button>

            </th>

        `;

    });


    html += `

                </tr>

            </thead>

            <tbody>

    `;


    /* O'QUVCHILAR */

    data.names.forEach(function(name, studentIndex) {

        html += `

            <tr>

                <td>
                    ${studentIndex + 1}
                </td>

                <td class="name">

                    <input
                        class="name-input"
                        value="${escapeHtml(name)}"
                        onchange="changeName(
                            ${studentIndex},
                            this.value
                        )"
                    >

                </td>

        `;


        /* DAVOMAT */

        data.dates.forEach(function(date, dateIndex) {

            const value =
                data.attendance[studentIndex]?.[dateIndex] || "";


            let className = "";


            if (value === "+") {

                className = "present";

            }


            if (value === "-") {

                className = "absent";

            }


            html += `

                <td class="date">

                    <input
                        class="attendance-input ${className}"
                        maxlength="1"
                        value="${value}"
                        oninput="changeAttendance(
                            ${studentIndex},
                            ${dateIndex},
                            this
                        )"
                    >

                </td>

            `;

        });


        html += `

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML = html;

}


/* =========================
   HTML XAVFSIZLIGI
========================= */

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   ISMNI O'ZGARTIRISH
========================= */

function changeName(index, value) {

    data.names[index] = value;

    saveData();

}


/* =========================
   DAVOMATNI O'ZGARTIRISH
========================= */

function changeAttendance(
    studentIndex,
    dateIndex,
    input
) {

    let value = input.value;


    /* Faqat + yoki - */

    if (
        value !== "+" &&
        value !== "-"
    ) {

        value = "";

        input.value = "";

    }


    if (!data.attendance[studentIndex]) {

        data.attendance[studentIndex] = [];

    }


    data.attendance[studentIndex][dateIndex] =
        value;


    /* Rangni o'zgartirish */

    input.classList.remove(
        "present",
        "absent"
    );


    if (value === "+") {

        input.classList.add("present");

    }


    if (value === "-") {

        input.classList.add("absent");

    }


    saveData();

}


/* =========================
   SANA QO'SHISH
========================= */

function addDate() {

    const date = prompt(
        "Sanani kiriting:\n\nMasalan: 17.10.2026"
    );


    if (!date) {

        return;

    }


    /* Sana formatini tekshirish */

    const pattern =
        /^\d{2}\.\d{2}\.\d{4}$/;


    if (!pattern.test(date)) {

        alert(
            "Sana noto‘g‘ri formatda!\n\n" +
            "Masalan: 17.10.2026"
        );

        return;

    }


    /* Sanani tekshirish */

    const parts = date.split(".");

    const day = Number(parts[0]);
    const month = Number(parts[1]);
    const year = Number(parts[2]);


    const testDate =
        new Date(year, month - 1, day);


    if (
        testDate.getFullYear() !== year ||
        testDate.getMonth() !== month - 1 ||
        testDate.getDate() !== day
    ) {

        alert("Bunday sana mavjud emas!");

        return;

    }


    /* Takroriy sana */

    if (data.dates.includes(date)) {

        alert(
            "Bu sana allaqachon mavjud!"
        );

        return;

    }


    /* Yangi sana */

    data.dates.push(date);


    saveData();

    render();

}


/* =========================
   SANANI O'CHIRISH
========================= */

function deleteDate(index) {

    const date =
        data.dates[index];


    const confirmDelete =
        confirm(
            date +
            " sanasini o‘chirmoqchimisiz?"
        );


    if (!confirmDelete) {

        return;

    }


    data.dates.splice(index, 1);


    data.attendance.forEach(function(row) {

        if (row) {

            row.splice(index, 1);

        }

    });


    saveData();

    render();

}


/* =========================
   DARK MODE
========================= */

function toggleDarkMode() {

    document.body.classList.toggle("dark");


    if (
        document.body.classList.contains("dark")
    ) {

        localStorage.setItem(
            "davomat_dark",
            "true"
        );

    } else {

        localStorage.setItem(
            "davomat_dark",
            "false"
        );

    }

}


/* =========================
   DARK MODENI YUKLASH
========================= */

if (
    localStorage.getItem("davomat_dark") === "true"
) {

    document.body.classList.add("dark");

}

</script>

</body>
</html>
